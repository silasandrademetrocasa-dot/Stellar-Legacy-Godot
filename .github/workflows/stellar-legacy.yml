name: Install complete Stellar release and publish
on:
  push:
    paths: ['**.zip', '**/*.zip', 'release-manifest.json', '.github/workflows/stellar-legacy.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stellar-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == github.event.repository.default_branch && 'github-pages' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all parts and bootstrap the verified installer
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,tempfile,zipfile
          root=pathlib.Path('.')
          m=json.loads((root/'release-manifest.json').read_text())
          sha=lambda b:hashlib.sha256(b).hexdigest()
          archives=list(root.rglob('*'))
          installer=next(f for f in m['files'] if f['path']=='tools/install-release.py')
          code=None
          for part in m['parts']:
              matches=[p for p in archives if p.is_file() and p.suffix.lower()=='.zip' and p.stat().st_size==part['bytes'] and sha(p.read_bytes())==part['sha256']]
              if not matches:raise RuntimeError('Missing/corrupted part: '+part['name']+'; nothing will be committed or published')
              if part['name']==installer['part']:
                  with zipfile.ZipFile(matches[0]) as z:code=z.read(installer['path'])
          assert code and sha(code)==installer['sha256']
          with tempfile.TemporaryDirectory() as d:
              script=pathlib.Path(d)/'install.py';script.write_bytes(code)
              subprocess.run(['python',str(script),'--manifest','release-manifest.json','--archives','.','--destination','.'],check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit complete replacement and verify remote revision
        shell: bash
        run: |
          git config user.name 'stellar-release[bot]'
          git config user.email 'stellar-release@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Install verified complete Stellar release [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
      - uses: actions/configure-pages@v5
        if: github.ref_name == github.event.repository.default_branch
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: github.ref_name == github.event.repository.default_branch
